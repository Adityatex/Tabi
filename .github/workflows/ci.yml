name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: Install tabi-mcp
        run: npm --prefix mcp ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build tabi-mcp
        run: npm --prefix mcp run build

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: tabi-chrome-mv3
          path: .output/chrome-mv3

  eval-mock:
    # End-to-end: real extension in real Chromium, scripted planner (no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Mock eval
        run: npm run eval:mock -- --timeout 45

      - name: Custom code runs isolated, without network functions (mock)
        run: npm run eval:mock -- --task invoice-total --custom-code --timeout 45

      - name: Save as workflow, then replay it with no model calls (mock)
        run: npm run eval:mock -- --task login,checkout-flow,iframe-cross-origin --trials 2 --replay --timeout 45

      - name: Run tasks as /shortcuts from the picker (mock)
        run: npm run eval:mock -- --task login,checkout-flow --shortcuts --timeout 45

      - name: A scheduled workflow runs on its alarm (real Chrome alarm, background tab, notification)
        run: npm run eval:schedule

      - name: Parallel background tasks respect the limit (tab group, queue, notifications)
        run: npm run eval:parallel

      - name: Asks before an action that can't be undone (Don't allow, background notification, Allow)
        run: npm run eval:confirm

      - name: Site lists hold (Settings, blocked site refused and never read, allow list asks)
        run: npm run eval:sites

      - name: Run timeline is saved and shown (History page, tokens, masked password, export, delete)
        run: npm run eval:history

      - name: Settings page works (provider and masked key, backups and order, safety, schedules, deep links, open shortcut)
        run: npm run eval:settings

      - name: Skills from the / menu (listed, picked, in the first prompt, background tab, unknown name)
        run: npm run eval:skills

      - name: Save as skill, then reuse it (mock)
        run: npm run eval:mock -- --task login --trials 2 --learn --timeout 45

      - name: tabi-mcp end to end (MCP client, real extension, real Chromium)
        run: |
          npm --prefix mcp ci
          npm --prefix mcp run build
          npm run eval:mcp

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-mock-results
          path: eval/results
